[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=true
custom_features=""
export_filter="all_resources"
include_filter="assets/fonts/OFL.txt"
exclude_filter="assets/fonts/NotoSansTC.ttf,assets/fonts/WebUI.tres,assets/source/*,docs/*,tests/*,build/*,web/*"
export_path="build/web/index.html"

[preset.0.options]
custom_template/debug="build/toolchain/web_nothreads_debug.zip"
custom_template/release="build/toolchain/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell="web/shell.html"
html/head_include=""
html/canvas_resize_policy=1
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
